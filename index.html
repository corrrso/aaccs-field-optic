<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>AACCS // FIELD_OPTIC</title>
<style>
  :root { --y:#FFD100; --k:#080808; --c:#E4E1DA; --g:#8A867C;
          --f:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--k); color:var(--c);
              font-family:var(--f); text-transform:uppercase; -webkit-user-select:none; user-select:none;
              -webkit-tap-highlight-color:transparent; }
  #bg,#cam,#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cam { object-fit:cover; display:none; }
  #gl { touch-action:none; }

  #hud { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
         padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
                 max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
  .bar { display:flex; justify-content:space-between; align-items:stretch; background:var(--k); border:3px solid var(--y); }
  .brand { font-weight:800; font-size:16px; letter-spacing:.06em; display:flex; align-items:center; }
  .brand b { background:var(--y); color:var(--k); padding:6px 8px; margin-right:8px; }
  .clk { color:var(--y); font-weight:700; font-size:13px; padding:0 8px; display:flex; align-items:center; border-left:3px solid var(--y); }
  .haz { height:8px; background:repeating-linear-gradient(-45deg,var(--y) 0 10px,var(--k) 10px 20px); }
  .sub { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; font-size:10px; font-weight:700; }
  .sub span { background:rgba(8,8,8,.85); padding:3px 6px; border-left:4px solid var(--y); }
  .sub span.warn { border-color:var(--c); color:var(--g); }

  .ret { position:absolute; left:50%; top:50%; width:110px; height:110px; transform:translate(-50%,-50%); opacity:.55;
         background:
          linear-gradient(var(--y),var(--y)) top left/18px 2px no-repeat, linear-gradient(var(--y),var(--y)) top left/2px 18px no-repeat,
          linear-gradient(var(--y),var(--y)) top right/18px 2px no-repeat, linear-gradient(var(--y),var(--y)) top right/2px 18px no-repeat,
          linear-gradient(var(--y),var(--y)) bottom left/18px 2px no-repeat, linear-gradient(var(--y),var(--y)) bottom left/2px 18px no-repeat,
          linear-gradient(var(--y),var(--y)) bottom right/18px 2px no-repeat, linear-gradient(var(--y),var(--y)) bottom right/2px 18px no-repeat,
          linear-gradient(var(--c),var(--c)) center/10px 1px no-repeat, linear-gradient(var(--c),var(--c)) center/1px 10px no-repeat; }

  footer { display:flex; flex-direction:column; gap:8px; min-width:0; }
  #tele { margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:1px 10px; font-size:10.5px; line-height:1.35;
          background:rgba(8,8,8,.82); border-left:6px solid var(--y); padding:6px 8px; }
  #tele dt { color:var(--y); font-weight:800; }
  #tele dd { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tele { pointer-events:auto; }
  #tele.min dt:nth-of-type(n+4), #tele.min dd:nth-of-type(n+4) { display:none; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .seg { display:grid; grid-template-columns:auto repeat(3,minmax(0,1fr)); gap:0; border:3px solid var(--y); background:var(--k); }
  .seg span { color:var(--y); font-weight:800; font-size:11px; padding:0 8px; display:flex; align-items:center; border-right:3px solid var(--y); }
  .seg .btn { border:0; min-height:42px; font-size:12px; }
  .seg .btn + .btn { border-left:3px solid var(--y); }
  #hint { display:none; align-self:center; background:var(--y); color:var(--k); font-weight:800; font-size:13px; padding:8px 12px; }
  body.xr #hint { display:block; }
  #hint small { display:block; margin-top:4px; font-size:9.5px; font-weight:700; line-height:1.4; }
  body.xr .ret { display:none; }
  .btn { pointer-events:auto; touch-action:manipulation; font:inherit; font-weight:800; font-size:13px; letter-spacing:.06em;
         text-transform:uppercase; min-height:52px; padding:0 8px; border-radius:0; cursor:pointer;
         background:var(--k); color:var(--y); border:3px solid var(--y); }
  .btn[aria-pressed="true"] { background:var(--y); color:var(--k); }
  .btn:disabled { opacity:.3; cursor:not-allowed; }
  .btn:focus-visible { outline:3px solid var(--c); outline-offset:2px; }
  .snap { background:var(--y); color:var(--k); font-size:17px; min-height:64px; box-shadow:5px 5px 0 var(--c); }
  .snap:active { transform:translate(5px,5px); box-shadow:none; }
  @media (min-width:760px) { footer { max-width:440px; } }

  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }
  #flash.on { opacity:.85; transition:none; }
  #toast { position:fixed; left:50%; top:30%; transform:translateX(-50%); background:var(--y); color:var(--k); font-weight:800;
           font-size:12px; padding:10px 14px; border:3px solid var(--k); opacity:0; pointer-events:none; transition:opacity .3s;
           max-width:90vw; text-align:center; }
  #toast.on { opacity:1; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--k);
          color:var(--y); font-weight:800; letter-spacing:.1em; font-size:14px; padding:24px; text-align:center; }
</style>

<body>
<canvas id="bg"></canvas>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="hud">
  <header>
    <div class="bar">
      <div class="brand"><b>AACCS</b>// FIELD_OPTIC</div>
      <div class="clk" id="clk">--:--:--Z</div>
    </div>
    <div class="haz"></div>
    <div class="sub">
      <span id="sOptic" class="warn">OPTIC: INIT</span>
      <span id="sGeo" class="warn">GEO: —</span>
      <span>PEAK CLUSTER // COASTAL AGI</span>
    </div>
  </header>
  <div class="ret"></div>

    <dl id="tele" title="Tap to collapse"></dl>

      <button class="btn" data-s="1" aria-pressed="true">1:1</button>

      <button class="btn" data-s="0.01" aria-pressed="false">1:100</button>

      <button class="btn" id="bAR" disabled>[ AR: CHECKING ]</button>

    'THREE.JS CDN UNREACHABLE // CONNECT ONCE TO LOAD, THEN RETRY'; }, 12000);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const FONT = '"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
const COL = { y: '#FFD100', k: '#080808', c: '#E4E1DA', g: '#8A867C' };

/* ================= CORE ================= */
const glCanvas = $('gl'), bg = $('bg'), video = $('cam');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 900);
camera.position.set(70, 55, 85).multiplyScalar(innerWidth < innerHeight ? 1.55 : 1);
const controls = new OrbitControls(camera, glCanvas);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 12;
controls.maxDistance = 340;

scene.add(new THREE.HemisphereLight(0xf4f2ec, 0x3a3832, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-60, 90, 45);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 10, far: 260 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const SUN_OFF = sun.position.clone();

/* ================= MATERIALS + HELPERS ================= */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
const M = {
  conc: mat(0xc9c4ba), concDark: mat(0x8f8a80), asphalt: mat(0x26262a, { roughness: 0.95 }),
  galv: mat(0x8c9196, { metalness: 0.5, roughness: 0.5 }), steel: mat(0xa3a7ab, { metalness: 0.6, roughness: 0.45 }),
  yellow: mat(0xffd100, { roughness: 0.6 }), black: mat(0x0d0d0d), white: mat(0xe8e6e0), pipe: mat(0xdedad2, { roughness: 0.6 }),
  glass: mat(0x1d2a33, { metalness: 0.3, roughness: 0.15 }), soil: mat(0x5a4532, { roughness: 1, flatShading: true }),
  soilDark: mat(0x2e241b, { roughness: 1 }), strip: mat(0x7a6650, { roughness: 1 }),
  mesh: new THREE.MeshStandardMaterial({ color: 0xb8bcc0, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  beacon: mat(0xff9900, { emissive: 0xff7a00, emissiveIntensity: 0 }),
};
const UP = new THREE.Vector3(0, 1, 0);
const shade = (m) => { m.castShadow = m.receiveShadow = true; return m; };

// box sitting on y (base), centred on x/z
function box(w, h, d, m, x, y, z, p) {
  const o = shade(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m));
  o.position.set(x, y + h / 2, z); p.add(o); return o;
}
// box centred on x/y/z with x-rotation (for angled parts)
function part(w, h, d, m, x, y, z, rx, p) {
  const o = box(w, h, d, m, x, y - h / 2, z, p); o.rotation.x = rx; return o;
}
function cylY(r, h, m, x, y, z, p, rTop = r) {
  const o = shade(new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, 20), m));
  o.position.set(x, y + h / 2, z); p.add(o); return o;
}
function pipe(pts, r, m, p) {
  const v = pts.map((a) => new THREE.Vector3(...a));
  for (let i = 0; i < v.length - 1; i++) {
    const a = v[i], b = v[i + 1];
    const o = shade(new THREE.Mesh(new THREE.CylinderGeometry(r, r, a.distanceTo(b), 16), m));
    o.position.copy(a).add(b).multiplyScalar(0.5);
    o.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
    p.add(o);
    if (i) { const j = shade(new THREE.Mesh(new THREE.SphereGeometry(r * 1.08, 16, 10), m)); j.position.copy(a); p.add(j); }
  }
}
function inst(geo, m, items, place, p) {
  const im = shade(new THREE.InstancedMesh(geo, m, items.length)), o = new THREE.Object3D();
  items.forEach((it, i) => {
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    place(o, it, i); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
  });
  p.add(im); return im;
}
// screen-constant label sprite (rendered into the GL canvas, so it lands in snapshots)
function label(text, x, y, z, p) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 44;
  g.font = `800 ${fs}px ${FONT}`;
  c.width = Math.ceil(g.measureText(text).width) + 40; c.height = fs + 26;
  g.fillStyle = COL.k; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = COL.y; g.fillRect(0, 0, 10, c.height);
  g.font = `800 ${fs}px ${FONT}`; g.textBaseline = 'middle'; g.fillText(text, 22, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, sizeAttenuation: false }));
  s.scale.set(0.02 * c.width / c.height, 0.02, 1); s.position.set(x, y, z); s.renderOrder = 10;
  p.add(s); return s;
}
function padTexture(stone) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1000; // 20 px per metre
  const g = c.getContext('2d');
  g.fillStyle = stone ? '#857e71' : '#cdc8bd'; g.fillRect(0, 0, 1200, 1000);
  for (let i = 0; i < 9000; i++) {
    const v = (Math.random() * 60) | 0, b = stone ? 40 : 90;
    g.fillStyle = `rgba(${b + v},${b - 2 + v},${b - 8 + v},${Math.random() * 0.25})`;
    g.fillRect(Math.random() * 1200, Math.random() * 1000, 2 + Math.random() * 4, 2 + Math.random() * 4);
  }
  g.beginPath();
  if (stone) { // tyre ruts: turning loop + gate approach
    g.strokeStyle = 'rgba(50,42,34,.4)'; g.lineWidth = 16;
    g.ellipse(600, 520, 190, 170, 0, 0, Math.PI * 2);
    g.moveTo(540, 1000); g.lineTo(540, 700); g.moveTo(660, 1000); g.lineTo(660, 700);
  } else { // 5 m expansion joints
    g.strokeStyle = 'rgba(60,58,52,.55)'; g.lineWidth = 2;
    for (let x = 100; x < 1200; x += 100) { g.moveTo(x, 0); g.lineTo(x, 1000); }
    for (let y = 100; y < 1000; y += 100) { g.moveTo(0, y); g.lineTo(1200, y); }
  }
  g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// points along the 60x50 m compound edge, skipping the south gate opening
function perimeter(step, gateHalf) {
  const hx = 30, hz = 25, out = [];
  const sides = [[-hx, -hz, hx, -hz], [hx, -hz, hx, hz], [hx, hz, -hx, hz], [-hx, hz, -hx, -hz]];
  for (const [x0, z0, x1, z1] of sides) {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.round(len / step), rot = Math.atan2(-(z1 - z0), x1 - x0);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t;
      if (z === hz && Math.abs(x) < gateHalf) continue;
      out.push({ x, z, rot, len: len / n });
    }
  }
  return out;
}

/* ================= SITE (shared) ================= */
const root = new THREE.Group();             // whole model; moved/scaled when placed in AR
const site = new THREE.Group(), op = new THREE.Group(), con = new THREE.Group();
root.add(site, op, con); scene.add(root);

const SX = 18, SZ = -14, STACK_TOP = 10;      // vent stack position / exit height (m)

box(60, 0.3, 50, M.concDark, 0, -0.3, 0, site);                           // 60 x 50 m compound slab
for (const [grp, stone] of [[op, false], [con, true]]) {
  const top = new THREE.Mesh(new THREE.PlaneGeometry(60, 50), new THREE.MeshStandardMaterial({ map: padTexture(stone), roughness: 0.95 }));
  top.rotation.x = -Math.PI / 2; top.position.y = 0.02; top.receiveShadow = true; grp.add(top);
}
const grid = new THREE.GridHelper(400, 80, 0xffd100, 0x6b675e);
grid.position.y = -0.3; Object.assign(grid.material, { transparent: true, opacity: 0.28, depthWrite: false });
site.add(grid);

box(9, 0.3, 100, M.asphalt, 0, -0.3, 75, site);                           // access road
for (let z = 28; z < 124; z += 6) box(0.18, 0.02, 3, M.yellow, 0, 0, z, site);
box(9, 0.03, 25, M.asphalt, 0, 0.02, 12.5, site);                         // gate apron
box(2.6, 0.6, 2.6, M.conc, SX, 0, SZ, site);                              // stack foundation

const dimMat = new THREE.LineBasicMaterial({ color: 0xffd100 });
function dim(a, b, n, text) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), N = new THREE.Vector3(...n);
  const pts = [A, B, A.clone().add(N), A.clone().sub(N), B.clone().add(N), B.clone().sub(N)];
  site.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), dimMat));
  label(text, (A.x + B.x) / 2, A.y + 1.5, (A.z + B.z) / 2, site);
}
dim([-30, -0.25, -29], [30, -0.25, -29], [0, 0, 1.2], '60 M');
dim([34, -0.25, -25], [34, -0.25, 25], [1.2, 0, 0], '50 M');
label('N', 0, 1, -42, site);
label('FROM PEAK CLUSTER PIPELINE', -14, 3, -72, site);
label('TO OFFSHORE STORE', 72, 3, -10, site);

/* ================= OPERATIONAL AGI ================= */
// palisade security fence 2.6 m + gate
const fSegs = perimeter(2.75, 4.6), fPales = perimeter(0.24, 4.6);
inst(new THREE.BoxGeometry(0.07, 2.6, 0.025), M.galv, fPales, (o, s) => { o.position.set(s.x, 1.3, s.z); o.rotation.y = s.rot; }, op);
inst(new THREE.BoxGeometry(0.12, 2.7, 0.12), M.galv, fSegs, (o, s) => o.position.set(s.x, 1.35, s.z), op);
for (const y of [0.45, 2.1])
  inst(new THREE.BoxGeometry(1, 0.06, 0.1), M.galv, fSegs, (o, s) => { o.position.set(s.x, y, s.z); o.rotation.y = s.rot; o.scale.x = s.len; }, op);
for (const x of [-2.3, 2.3]) {
  box(4.5, 2.4, 0.08, M.yellow, x, 0, 25, op);
  for (const y of [0.8, 1.6]) box(4.52, 0.22, 0.1, M.black, x, y, 25, op);
}

// 10 m vent stack
cylY(0.55, 0.25, M.steel, SX, 0.6, SZ, op);
cylY(0.32, 7.9, M.white, SX, 0.85, SZ, op);
cylY(0.32, 0.6, M.yellow, SX, 8.75, SZ, op);
cylY(0.32, 0.45, M.black, SX, 9.35, SZ, op);
cylY(0.32, 0.2, M.steel, SX, 9.8, SZ, op, 0.4);
cylY(1.15, 0.08, M.galv, SX, 7.6, SZ, op);                                 // access platform
const ring = shade(new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.035, 6, 32), M.yellow));
ring.rotation.x = Math.PI / 2; ring.position.set(SX, 8.7, SZ); op.add(ring);
for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; box(0.05, 1.05, 0.05, M.yellow, SX + Math.cos(a) * 1.15, 7.68, SZ + Math.sin(a) * 1.15, op); }
for (const dz of [-0.22, 0.22]) box(0.05, 7, 0.05, M.galv, SX + 0.55, 0.6, SZ + dz, op);
for (let y = 0.9; y < 7.6; y += 0.3) box(0.04, 0.04, 0.44, M.galv, SX + 0.55, y, SZ, op);
label('VENT STACK // 10 M', SX, 12.5, SZ, op);

// pipework: incoming riser -> ESDV -> header -> export, pig receiver branch, vent line to stack
const PY = 1.2, PR = 0.3;
pipe([[-14, -0.3, -24], [-14, PY, -24], [-14, PY, -10], [12, PY, -10], [12, -0.3, -10]], PR, M.pipe, op);
for (let x = -12; x <= 10; x += 4) box(0.4, PY - PR, 1, M.conc, x, 0, -10, op);
for (let z = -22; z <= -12; z += 4) box(1, PY - PR, 0.4, M.conc, -14, 0, z, op);
function esdv(x, z, alongX) {
  box(alongX ? 1 : 0.9, 0.9, alongX ? 0.9 : 1, M.steel, x, PY - 0.45, z, op);
  box(0.7, 0.9, 0.7, M.yellow, x, PY + 0.45, z, op);
  box(0.3, 0.3, 0.3, M.black, x, PY + 1.35, z, op);
}
esdv(-14, -18, false); esdv(6, -10, true);
label('ESDV', -14, 4.2, -18, op);
pipe([[-8, PY, -10], [-8, PY, -4], [-5, PY, -4]], PR, M.pipe, op);
const barrel = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 8, 20).rotateZ(Math.PI / 2), M.pipe));
barrel.position.set(-1, PY, -4); op.add(barrel);
const door = shade(new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.2, 20).rotateZ(Math.PI / 2), M.yellow));
door.position.set(3.1, PY, -4); op.add(door);
for (const x of [-4, -1, 2]) box(0.5, PY - 0.5, 1.1, M.conc, x, 0, -4, op);
pipe([[1, PY + 0.5, -4], [1, PY + 1.2, -4], [1, PY + 1.2, -10], [1, PY + 0.3, -10]], 0.15, M.pipe, op);

  let y = 58;
  for (const [k, v] of rows) {
    font(c, 800, 19); c.fillStyle = COL.y; c.fillText(k, 356, y);
    font(c, 500, 19); c.fillStyle = COL.c; c.fillText(v, 446, y, LW - 468);
    y += 29;
  }
  font(c, 600, 13); c.fillStyle = COL.g;
  c.fillText('OVERLAY = SCHEMATIC 3D MODEL. GAS = VISUAL SIMULATION, NOT A DISPERSION MODEL.', 356, 298, LW - 378);
  c.restore();
}

let snapping = false;
function snap() {
  if (snapping) return; snapping = true;
  renderer.render(scene, camera);            // fresh frame so the GL buffer is valid for drawImage
  const W = glCanvas.width, H = glCanvas.height, s = Math.min(W, H) / 1080, BH = Math.round(330 * s);
  const out = document.createElement('canvas'); out.width = W; out.height = H + BH;
  const c = out.getContext('2d');
  c.fillStyle = COL.k; c.fillRect(0, 0, W, H);
  if (camLive && video.videoWidth) {         // replicate object-fit: cover
    const k = Math.max(W / video.videoWidth, H / video.videoHeight), dw = video.videoWidth * k, dh = video.videoHeight * k;
    c.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else c.drawImage(bg, 0, 0, W, H);
  c.drawImage(glCanvas, 0, 0);
  const id = `AX-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(16).slice(2, 6).toUpperCase()}`;
  drawBanner(c, H, W, s, id, telemetry());

  const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => f.classList.remove('on'));
  const name = `AACCS_PROOF_${utc().replace(/[-:]/g, '')}.png`;
  out.toBlob((blob) => {
    snapping = false;
    if (!blob) return toast('CAPTURE FAILED');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`PROOF SAVED // ${name}`);
  }, 'image/png');
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
$('bSnap').onclick = snap;

/* ================= AR PLACEMENT ================= */
// Android Chrome: WebXR immersive-ar + hit-test (live sim). iOS: AR Quick Look via generated USDZ (static snapshot).
const SCALE_TXT = { 1: '1:1', 0.1: '1:10', 0.01: '1:100' };
let scale = 1, arKind = null, xrOn = false, placed = false, hitSource = null;
const bAR = $('bAR'), bSnap = $('bSnap'), hint = $('hint');
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd100 }));
reticle.add(new THREE.Mesh(new THREE.CircleGeometry(0.03, 12).rotateX(-Math.PI / 2), reticle.material));
reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
const anchorP = new THREE.Vector3(), anchorD = new THREE.Vector3(0, 0, 1), tmp = new THREE.Vector3();
// on-screen AR diagnostics (field debugging without devtools)
const dbg = { hits: 0, frames: 0, selects: 0, err: '' };
addEventListener('error', (e) => { dbg.err = e.message; });
addEventListener('unhandledrejection', (e) => { dbg.err = String(e.reason?.message || e.reason); });
const hintMsg = (msg) => { hint.dataset.msg = msg; };
function dbgLine() {
  const cam = tmp.setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
  const d = placed ? cam.distanceTo(anchorP).toFixed(1) : '-';
  return `GROUND ${dbg.hits ? 'LOCK' : 'NONE'} // FRAMES ${dbg.frames} // TAPS ${dbg.selects}<br>` +
    `PLACED ${placed ? 'Y' : 'N'} // EDGE ${d} M // ROOT ${root.position.toArray().map((v) => v.toFixed(1)).join(',')} // S ${root.scale.x}` +
    (dbg.err ? `<br>ERR ${dbg.err}` : '');
}
const camSave = { p: new THREE.Vector3(), q: new THREE.Quaternion() };

// gate-side fence edge sits on the tapped point; compound extends away from the viewer
function placeRoot() {
  root.scale.setScalar(scale);
  root.rotation.y = Math.atan2(anchorD.x, anchorD.z);
  root.position.copy(anchorP).addScaledVector(anchorD, -25 * scale);
  sun.position.copy(root.position).addScaledVector(SUN_OFF, scale);
  sun.target.position.copy(root.position);
  Object.assign(sun.shadow.camera, { left: -75 * scale, right: 75 * scale, top: 75 * scale, bottom: -75 * scale, near: 10 * scale, far: 260 * scale });
  sun.shadow.camera.updateProjectionMatrix();
}
function resetRoot() {                      // back to the 1:1 origin used by the orbit preview
  const s = scale; scale = 1; anchorP.set(0, 0, 25); anchorD.set(0, 0, 1); placeRoot(); scale = s;
}
function setScale(s) {
  scale = s;
  for (const b of $('seg').querySelectorAll('.btn')) b.setAttribute('aria-pressed', String(+b.dataset.s === s));
  if (xrOn && placed) placeRoot();
  updateHud();
}
$('seg').onclick = (e) => { const b = e.target.closest('.btn'); if (b) setScale(+b.dataset.s); };

async function startXR() {
  stopCamera(); video.style.display = 'none'; bg.style.display = 'none';
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('hud') },
    });
    session.addEventListener('end', endXR);
    session.addEventListener('select', () => {
      dbg.selects++;
      if (!reticle.visible) return toast('NO GROUND LOCK // MOVE PHONE SLOWLY OVER THE GROUND');
      anchorP.setFromMatrixPosition(reticle.matrix);
      tmp.setFromMatrixPosition(renderer.xr.getCamera().matrixWorld).sub(anchorP).setY(0);
      if (tmp.lengthSq() > 1e-6) anchorD.copy(tmp.normalize());
      placed = true; root.visible = true; placeRoot();
      hintMsg('TAP GROUND AGAIN TO MOVE');
    });
    camSave.p.copy(camera.position); camSave.q.copy(camera.quaternion);
    Object.assign(dbg, { hits: 0, frames: 0, selects: 0, err: '' });
    await renderer.xr.setSession(session);
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
    xrOn = true; placed = false; root.visible = false; grid.visible = false; controls.enabled = false;
    document.body.classList.add('xr');
    hintMsg('AIM AT GROUND // TAP TO PLACE');
    bAR.textContent = '[ EXIT AR ]'; bAR.setAttribute('aria-pressed', 'true');
    bSnap.disabled = true; bSnap.textContent = '[ USE OS SCREENSHOT ]';
  } catch (e) {
    toast(`AR FAILED // ${e.name || e.message}`); endXR();
  }
}
function endXR() {
  hitSource?.cancel?.(); hitSource = null;
  xrOn = false; placed = false; root.visible = true; grid.visible = true; controls.enabled = true; reticle.visible = false;
  document.body.classList.remove('xr');
  resetRoot();
  if (camSave.p.lengthSq()) { camera.position.copy(camSave.p); camera.quaternion.copy(camSave.q); camera.fov = 50; camera.updateProjectionMatrix(); controls.update(); }
  bAR.textContent = '[ PLACE IN AR ]'; bAR.setAttribute('aria-pressed', 'false');
  bSnap.disabled = false; bSnap.textContent = '[ SNAP PROOF ]';
  fallback('ACQUIRING'); initOptic(); resize();
}
// buttons inside the DOM overlay must not also count as "tap to place"
document.querySelector('footer').addEventListener('beforexrselect', (e) => { if (e.target.closest('.btn, #tele')) e.preventDefault(); });
$('tele').onclick = () => $('tele').classList.toggle('min');

// iOS: bake the visible model (instances merged, static plume volume) into a USDZ and open AR Quick Look
async function quickLook() {
  bAR.disabled = true; bAR.textContent = '[ BUILDING USDZ… ]';
  try {
    const out = new THREE.Group(), m4 = new THREE.Matrix4();
    root.updateMatrixWorld(true);
    for (const g of [site, mode === 'op' ? op : con]) g.traverse((o) => {
      if (!o.isMesh) return;
      let geo = o.geometry;
      if (o.isInstancedMesh) {
        const parts = [];
        for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, m4); parts.push(o.geometry.clone().applyMatrix4(m4)); }
        geo = mergeGeometries(parts);
      }
      const mesh = new THREE.Mesh(geo, o.material); mesh.applyMatrix4(o.matrixWorld); out.add(mesh);
    });
    if (mode === 'op' && G.r > 1) {          // freeze current simulated ground plume as a translucent slab
      const slab = new THREE.Mesh(new THREE.CylinderGeometry(G.r, G.r, 1.2, 48),
        new THREE.MeshStandardMaterial({ color: 0xe0e8ec, transparent: true, opacity: 0.35 }));
      slab.position.set(SX, 0.6, SZ); out.add(slab);
    }
    const wrap = new THREE.Group(); wrap.add(out); wrap.scale.setScalar(scale);
    const data = await new USDZExporter().parse(wrap, { quickLookCompatible: true });
    const a = document.createElement('a');
    a.rel = 'ar'; a.download = 'aaccs.usdz';
    a.href = URL.createObjectURL(new Blob([data], { type: 'model/vnd.usdz+zip' })) + '#allowsContentScaling=0';
    a.appendChild(document.createElement('img'));
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {
    toast(`USDZ FAILED // ${e.message}`);
  }
  bAR.disabled = false; bAR.textContent = '[ OPEN IN AR ]';
}

bAR.onclick = () => { if (arKind === 'webxr') xrOn ? renderer.xr.getSession()?.end() : startXR(); else if (arKind === 'quicklook') quickLook(); };
(async () => {
  try { if (await navigator.xr?.isSessionSupported('immersive-ar')) arKind = 'webxr'; } catch {}
  if (!arKind && document.createElement('a').relList?.supports?.('ar')) arKind = 'quicklook';
  bAR.disabled = !arKind;
  bAR.textContent = arKind === 'webxr' ? '[ PLACE IN AR ]' : arKind === 'quicklook' ? '[ OPEN IN AR ]' : '[ AR: N/A HERE ]';
})();

/* ================= LOOP ================= */
function resize() {
  if (renderer.xr.isPresenting) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!camLive) drawGrid();
}
addEventListener('resize', resize);
resize();
setMode('op');

const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  try {
    if (frame) dbg.frames++;
    if (frame && hitSource) {
      const hits = frame.getHitTestResults(hitSource), pose = hits[0]?.getPose(renderer.xr.getReferenceSpace());
      dbg.hits = hits.length; reticle.visible = !!pose;
      if (pose) reticle.matrix.fromArray(pose.transform.matrix);
    } else if (!xrOn) controls.update();
    if (mode === 'op') stepGas(dt, t); else stepWorks(dt, t);
    renderer.render(scene, camera);
  } catch (e) { dbg.err = e.message; }
});
setInterval(updateHud, 250);

window.AACCS_UP = true; $('boot').remove();
fallback('ACQUIRING');                       // grid shows instantly; replaced if the camera comes up
initOptic().finally(initGeo);
</script>
</body>
</html>
